<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>foxOS Virtual Machine (Serenity Terminal)</title>
    <!-- Google Fonts for Retro CRT Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=Fira+Code:wght@400;600&family=Share+Tech+Mono&family=Space+Mono:ital,wght@0,400;0,700;1,400&family=VT323&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./crt.css">
    <link rel="stylesheet" href="./windows.css">
</head>
<body>
    <div id="monitor">
        <div id="crt">
            <!-- Terminal Buffer -->
            <div class="terminal" id="terminal-buffer">
                <div id="output-lines"></div>
                <div id="active-prompt-line" style="display: flex; align-items: baseline;">
                    <span id="prompt-label">foxOS:/USERS/GUEST&gt;&nbsp;</span>
                    <span id="input" contenteditable="true" spellcheck="false"></span>
                </div>
            </div>

            <!-- Floating CRT Windows Layer -->
            <div id="windows-container"></div>

            <!-- CRT Scanline Overlays -->
            <div class="scanlines"></div>
            <div class="scanline-beam"></div>
        </div>
    </div>

    <script type="module">
        import { applyTheme, getSavedTheme } from "./themes.js";
        import { getPromptPath, resetCurrentPathToUser } from "./vfs.js";
        import { executeCommand, navigateHistory } from "./kernel.js";
        import { type as typewriter } from "./typer.js";
        import { runBootSequence } from "./boot.js";
        import { initSettingsUI } from "./settings.js";
        import { getActiveUser } from "./session.js";
        import { playKeyClick, playRelayThump, playBell, playErrorBuzz, playDiskSeek, playBootChime } from "./audio.js";

        // Initialize System Settings and Controls
        initSettingsUI();

        const inputEl = document.getElementById("input");
        const inputLine = document.getElementById("active-prompt-line");
        const outputLines = document.getElementById("output-lines");
        const promptLabel = document.getElementById("prompt-label");
        const terminal = document.getElementById("terminal-buffer");

        // Sync initial working directory with active session (GUEST or Handle)
        const activeUser = getActiveUser();
        resetCurrentPathToUser(activeUser);
        promptLabel.textContent = getPromptPath();

        // Helper to place cursor at the very end of contenteditable text
        function setCaretToEnd(el) {
            const range = document.createRange();
            const sel = window.getSelection();
            range.selectNodeContents(el);
            range.collapse(false);
            sel.removeAllRanges();
            sel.addRange(range);
        }

        // Clean Execution Context passed to kernel commands
        const ctx = {
            print: (text) => {
                const div = document.createElement("div");
                div.className = "terminal-line";
                div.style.marginBottom = "0.25rem";
                div.style.whiteSpace = "pre-wrap";
                div.textContent = text;
                outputLines.appendChild(div);
                outputLines.scrollTop = outputLines.scrollHeight;
            },
            type: async (text, options = {}) => {
                await typewriter(outputLines, text, { scrollEl: outputLines, ...options });
            },
            html: (markup) => {
                const div = document.createElement("div");
                div.className = "terminal-line";
                div.style.marginBottom = "0.25rem";
                div.innerHTML = markup;
                outputLines.appendChild(div);
                outputLines.scrollTop = outputLines.scrollHeight;
            },
            error: (text) => {
                const div = document.createElement("div");
                div.className = "terminal-line";
                div.style.marginBottom = "0.25rem";
                div.style.whiteSpace = "pre-wrap";
                div.style.opacity = "0.85";
                div.textContent = text;
                outputLines.appendChild(div);
                outputLines.scrollTop = outputLines.scrollHeight;
            },
            clear: () => {
                outputLines.innerHTML = "";
                outputLines.scrollTop = 0;
            },
            bell: playBell,
            errorBuzz: playErrorBuzz,
            diskSeek: playDiskSeek,
            bootChime: playBootChime,
            relayThump: playRelayThump,
            setInputEnabled: (enabled) => {
                inputLine.style.display = enabled ? "flex" : "none";
                if (enabled) {
                    inputEl.focus();
                } else {
                    inputEl.blur();
                }
            }
        };

        function updatePrompt() {
            promptLabel.textContent = getPromptPath();
        }

        updatePrompt();

        // Run Authentic 1981 Hardware POST & Boot Sequence
        runBootSequence(ctx, false);

        inputEl.addEventListener("keydown", async (e) => {
            if (e.key === "Backspace" && inputEl.textContent.length === 0) {
                e.preventDefault();
                return;
            }

            if (e.key === "ArrowUp" && !e.shiftKey && !e.ctrlKey && !e.altKey) {
                e.preventDefault();
                playKeyClick();
                inputEl.textContent = navigateHistory("up", inputEl.textContent);
                setCaretToEnd(inputEl);
                return;
            }

            if (e.key === "ArrowDown" && !e.shiftKey && !e.ctrlKey && !e.altKey) {
                e.preventDefault();
                playKeyClick();
                inputEl.textContent = navigateHistory("down", inputEl.textContent);
                setCaretToEnd(inputEl);
                return;
            }

            if (e.key === "Enter") {
                e.preventDefault();
                playRelayThump();
                const raw = inputEl.textContent;
                inputEl.textContent = "";

                if (!raw.trim()) return;

                ctx.print(`${getPromptPath()}${raw}`);
                await executeCommand(raw, ctx);
                updatePrompt();
                return;
            }

            if (!e.ctrlKey && !e.metaKey && !["Shift", "Control", "Alt", "Meta", "CapsLock", "Tab"].includes(e.key)) {
                playKeyClick();
            }
        });

        document.getElementById("crt").addEventListener("click", (e) => {
            if (!e.target.closest("#dev-bar, select, button, a, .window")) {
                inputEl.focus();
            }
        });
    </script>
</body>
</html>
