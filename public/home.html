                <h1>Welcome to the site!</h1>
                <p>So... If you're new here, you may be wondering what's going on and what's with these commands? Why the hell don't I have links and menus like
                    any other self-respecting web dev? Well,
                    there's a couple of reasons for that.
                </p>
                <p>For one, my earliest computer usage was the old MSDOS command line operating system. I've always been
                    enamored with the older computers and
                    what developers were able to do with them despite their limitations.
                </p>
                <p>For two... well, this site is a game of sorts. It's an ongoing project of mine that I hope will span
                    years worth of development.
                    If you haven't figured it out just yet, use the Repair command to get started. The first goal will
                    become pretty obvious from there. After that, well, you'll get hints. Some of them will be /well
                    labeled/ and give clues as to what commands you'll need to progress. If you do happen to reach the
                    "end" of the current development of the story, don't worry, I will always make that clear and
                    unambiguous.
                </p>
                <p>I will say, however, that the "blog" and "recipes" will NEVER be a part of the game. Anything you
                    read there is purely
                    real-world only. Anything else is fair game, though.<br>
                    Guess you'll just have to explore everything. ~.^
                </p>
                <p>Welcome to the pack, Foxhound, and good luck.<br><br><br><br><br><br><br><br><br>You'll need it.<br>Ciao~<br>CV
                </p>
                <h3>Why not just make a game?</h3>
                <p>Honestly... I dunno. I've always enjoyed ARGs and the RPGs and roleplay and such. Rogue-likes have always held a special place in my heart as well,
                    especially the oldschool ones that use ASCII graphics. Cogmind, Dwarf Fortress, yadda yadda. After I discovered the indie web, I got the urge to create
                    my own site. I didn't really know what I wanted to do with it, I just know I wanted one. Hell, I didn't even know what I wanted it to look like!
                    But then I ran across another indie site. In the background was a game. Minesweeper. (If you know the one I'm talking about, Hi! If not... go check my links.)
                    Anyway, for some reason, I thought that was really cool. That's what I wanted. A site that wasn't just a site, but a game as well. A site that was an 
                    *experience*. And since I can't draw for shit... ASCII saves the day! Eventually I ran across another site that had a cool scanline effect in the background like
                    the old CRT monitors and... well, a short time later I was building the first version of the foxOS terminal!
                </p>
                <h3> So, who am I?</h3>
                <p>
                    Hi! I'm Kat, aka CyberVixen! I'm a 30-something disabled Navy veteran that lives with
                    and adores her three cats, one dog and
                    delightful platonic life partner. I play a lot of videos games, almost exclusively on
                    the PC. I also enjoy
                    cooking, whether its on the stove or my Blackstone griddle, I can always find solace in
                    a delicious meal.
                    Other than that, I'm learning the violin! I'm not that
                    good yet but I'm hoping
                    one day to be able to be able to play for others and not embarrass myself.</p>

                <p>Anyway! Thanks for the visit! I hope you find enough interesting things here to keep coming back. I
                    want to expand the content and the story of
                    foxOS and Serenity Industries until it's something really cool. Who knows. Maybe you can join me on the
                    ride and together we can build something even greater?
                </p>
                    Ciao~
                </p>
