<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber Vixen</title>
    <link rel="icon" type="image/x-icon" href="img/icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=VT323&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <script src="mobilecheck.js"></script>
    <script>
        const savedTheme = localStorage.getItem("theme");
        if (savedTheme) {
            document.documentElement.setAttribute("data-theme", savedTheme);
        }
    </script>
    <style>
        /* ── Green Theme (Default) ── */
        :root {
            --bg: #020502;
            --phosphor: #5bf870;
            --phosphor-bright: #afffc0;
            --phosphor-dim: #2ca539;
            --phosphor-glow: rgba(91, 248, 112, 0.6);
            --accent: #e024c3;
            --accent-bright: #ff85eb;
            --accent-glow: rgba(224, 36, 195, 0.6);
            --cursor-auto: url("/img/curosr.png"), auto;
            --cursor-pointer: url("/img/pointer.png"), pointer;
        }

        /* ── Amber Theme ── */
        :root[data-theme="amber"] {
            --bg: #060301;
            --phosphor: #ffc438;
            --phosphor-bright: #fff3c4;
            --phosphor-dim: #b37812;
            --phosphor-glow: rgba(255, 196, 56, 0.6);
            --accent: #ff4d88;
            --accent-bright: #ffa3c2;
            --accent-glow: rgba(255, 77, 136, 0.6);
            --cursor-auto: url("/img/curosr_amber.png"), auto;
            --cursor-pointer: url("/img/pointer_amber.png"), pointer;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            height: 100%;
            background: var(--bg);
            color: var(--phosphor);
            font-family: "Share Tech Mono", monospace;
            overflow: hidden;
            user-select: none;
            cursor: var(--cursor-auto);
            transition: background 0.3s ease;
        }

        a, button, [role="button"], .interactive {
            cursor: var(--cursor-pointer) !important;
        }

        /* ── Canvas Matrix Rain ── */
        #matrix-canvas {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            opacity: 0.88;
        }

        /* ── CRT Scanlines & Vignette ── */
        .crt-overlay {
            position: fixed;
            inset: 0;
            z-index: 50;
            pointer-events: none;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.4) 50%),
                        radial-gradient(circle at center, transparent 40%, rgba(0, 0, 0, 0.9) 100%);
            background-size: 100% 4px, 100% 100%;
        }

        /* ── Minimal Header Controls ── */
        .header-controls {
            position: fixed;
            top: 14px;
            right: 14px;
            z-index: 200;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.85rem;
            background: rgba(0, 0, 0, 0.8);
            border: 1px solid var(--phosphor-dim);
            padding: 5px 10px;
            border-radius: 2px;
            backdrop-filter: blur(4px);
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.9);
        }

        .header-controls button {
            color: var(--phosphor);
            background: transparent;
            border: 1px solid transparent;
            font-family: inherit;
            font-size: 0.8rem;
            padding: 3px 7px;
            transition: all 0.15s;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .header-controls button.active-opt {
            border-color: var(--phosphor);
            background: rgba(255, 255, 255, 0.08);
            font-weight: bold;
            text-shadow: 0 0 8px var(--phosphor-glow);
        }

        .header-controls button:hover:not(.active-opt) {
            background: rgba(255, 255, 255, 0.05);
        }

        .divider {
            color: var(--phosphor-dim);
            opacity: 0.5;
        }

        /* ── Prominent Corner Telemetry HUD ── */
        .hud-corner {
            position: fixed;
            z-index: 60;
            font-size: 0.9rem;
            color: var(--phosphor-bright);
            letter-spacing: 0.18em;
            padding: 1.5rem 1.75rem;
            line-height: 1.7;
            text-shadow: 0 0 8px var(--phosphor-glow), 0 2px 4px #000;
            pointer-events: none;
        }

        .top-left { top: 0; left: 0; }
        .bottom-left { bottom: 0; left: 0; }
        .bottom-right { bottom: 0; right: 0; text-align: right; }

        .status-dot {
            display: inline-block;
            width: 9px;
            height: 9px;
            background: var(--phosphor);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--phosphor);
            margin-right: 8px;
        }

        /* ── Main Stage ── */
        .stage {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            box-sizing: border-box;
            text-align: center;
        }

        .brand-container {
            margin-bottom: 2.25rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .brand-sub {
            font-size: 1rem;
            letter-spacing: 0.45em;
            color: var(--phosphor-bright);
            text-transform: uppercase;
            margin-bottom: 0.5rem;
            text-shadow: 0 0 10px var(--phosphor-glow), 0 2px 6px #000;
            font-weight: bold;
            opacity: 0;
            animation: powerOnSurround 0.8s ease-out forwards 3.25s;
        }

        .brand-title {
            font-family: "VT323", monospace;
            font-size: clamp(5.5rem, 14vw, 11rem);
            letter-spacing: 0.2em;
            text-transform: uppercase;
            line-height: 0.88;
            margin: 0.25rem 0;
            user-select: none;
        }

        .brand-cyber {
            display: inline-block;
            color: var(--phosphor);
            opacity: 0;
            animation: neonIgniteCyber 1.1s cubic-bezier(0.1, 0.9, 0.2, 1) forwards 0.8s;
        }

        .brand-vixen {
            display: inline-block;
            color: var(--accent);
            opacity: 0;
            animation: neonIgniteVixen 1.1s cubic-bezier(0.1, 0.9, 0.2, 1) forwards 2.05s;
        }

        @keyframes neonIgniteCyber {
            0% {
                opacity: 0;
                text-shadow: none;
            }
            15% {
                opacity: 0.85;
                text-shadow: 0 0 10px var(--phosphor-glow);
            }
            22% {
                opacity: 0.1;
                text-shadow: none;
            }
            36% {
                opacity: 0.95;
                text-shadow: 0 0 16px var(--phosphor-glow), 0 0 30px var(--phosphor-glow);
            }
            48% {
                opacity: 0.25;
                text-shadow: 0 0 4px var(--phosphor-glow);
            }
            62% {
                opacity: 1;
                text-shadow: 0 0 18px var(--phosphor-glow), 0 0 45px var(--phosphor-glow), 0 4px 12px #000;
            }
            74% {
                opacity: 0.88;
            }
            84%, 100% {
                opacity: 1;
                text-shadow: 0 0 18px var(--phosphor-glow), 0 0 45px var(--phosphor-glow), 0 4px 12px #000;
            }
        }

        @keyframes neonIgniteVixen {
            0% {
                opacity: 0;
                text-shadow: none;
            }
            15% {
                opacity: 0.9;
                text-shadow: 0 0 10px var(--accent-glow);
            }
            22% {
                opacity: 0.08;
                text-shadow: none;
            }
            36% {
                opacity: 0.95;
                text-shadow: 0 0 16px var(--accent-glow), 0 0 30px var(--accent-glow);
            }
            48% {
                opacity: 0.3;
                text-shadow: 0 0 4px var(--accent-glow);
            }
            62% {
                opacity: 1;
                text-shadow: 0 0 18px var(--accent-glow), 0 0 45px var(--accent-glow), 0 4px 12px #000;
            }
            74% {
                opacity: 0.88;
            }
            84%, 100% {
                opacity: 1;
                text-shadow: 0 0 18px var(--accent-glow), 0 0 45px var(--accent-glow), 0 4px 12px #000;
            }
        }

        .brand-tagline {
            margin-top: 1rem;
            font-size: 1.25rem;
            letter-spacing: 0.3em;
            color: var(--phosphor-bright);
            text-shadow: 0 0 10px var(--phosphor-glow), 0 2px 8px #000;
            font-weight: 500;
            opacity: 0;
            animation: powerOnSurround 0.8s ease-out forwards 3.35s;
        }

        /* ── Enter Button ── */
        .enter-btn {
            background: rgba(0, 0, 0, 0.75);
            border: 2px solid var(--phosphor);
            color: var(--phosphor);
            font-family: "Share Tech Mono", monospace;
            font-size: 1.3rem;
            letter-spacing: 0.22em;
            text-transform: uppercase;
            padding: 1.1rem 2.8rem;
            transition: all 0.2s cubic-bezier(0.2, 0.8, 0.2, 1);
            box-shadow: 0 0 25px rgba(0, 0, 0, 0.9), inset 0 0 12px rgba(0, 0, 0, 0.6), 0 0 20px var(--phosphor-glow);
            backdrop-filter: blur(6px);
            position: relative;
            overflow: hidden;
            display: inline-flex;
            align-items: center;
            gap: 14px;
            opacity: 0;
            animation: powerOnSurround 0.8s ease-out forwards 3.45s;
        }

        .enter-btn:hover {
            background: var(--phosphor);
            color: #000;
            box-shadow: 0 0 40px var(--phosphor-glow);
            transform: translateY(-2px);
        }

        .enter-btn:active {
            transform: translateY(0);
        }

        .enter-hint {
            margin-top: 1.25rem;
            font-size: 0.85rem;
            color: var(--phosphor-dim);
            letter-spacing: 0.2em;
            text-shadow: 0 2px 4px #000;
            opacity: 0;
            animation: powerOnSurround 0.8s ease-out forwards 3.55s;
        }

        @keyframes powerOnSurround {
            0% {
                opacity: 0;
                transform: translateY(8px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .brand-cyber, .brand-vixen, .brand-sub, .brand-tagline, .enter-btn, .enter-hint {
                animation: none !important;
                opacity: 1 !important;
                transform: none !important;
            }
        }

        /* ── Transition Out ── */
        .fade-out {
            opacity: 0;
            transform: scale(1.08);
            filter: blur(12px);
            transition: all 0.35s ease-in;
        }

        @media (max-width: 600px) {
            .hud-corner { display: none; }
            .brand-sub { font-size: 0.8rem; }
            .brand-tagline { font-size: 0.95rem; }
            .enter-btn { font-size: 1rem; padding: 0.85rem 1.8rem; }
            .header-controls { font-size: 0.75rem; padding: 4px 8px; }
        }
    </style>
</head>
<body>
    <canvas id="matrix-canvas"></canvas>
    <div class="crt-overlay"></div>

    <nav class="header-controls">
        <button type="button" id="btn-toggle-theme" title="Toggle Green / Amber Theme">
            THEME: <span id="theme-label">GREEN</span>
        </button>
        <span class="divider">|</span>
        <button type="button" id="btn-toggle-sound" title="Toggle System Sounds">
            SOUND: <span id="sound-label">ON</span>
        </button>
    </nav>

    <div class="hud-corner top-left">
        <div><span class="status-dot"></span>SYS_STAT: ONLINE</div>
        <div>NET_LINK: FOXNET-98</div>
    </div>

    <div class="hud-corner bottom-left">
        <div id="uptime">UPTIME: 00:00:00</div>
        <div>SEC_LEVEL: 0x7F</div>
    </div>

    <div class="hud-corner bottom-right">
        <div>PROTO: HTTPS/2.0</div>
        <div>ENGINE: HARMONY v1.33.7</div>
    </div>

    <main class="stage" id="main-stage">
        <div class="brand-container">
            <div class="brand-sub">// NEOCITIES NETWORK NODE //</div>
            <h1 class="brand-title">
                <span class="brand-cyber">CYBER</span><span class="brand-vixen">VIXEN</span>
            </h1>
            <div class="brand-tagline">"Harmony Engineered."</div>
        </div>

        <button class="enter-btn interactive" id="btn-enter" type="button">
            <span>[ INITIALIZE SYSTEM ]</span>
            <span>→</span>
        </button>
        <div class="enter-hint">PRESS [ENTER] OR [SPACE]</div>
    </main>

    <script>
        // ─── Sound Synthesizer (Web Audio API) ───────────────────────────────
        let audioCtx = null;
        let systemAudioMuted = localStorage.getItem("system_sound_muted") === "true";

        function playRetroChime(freq = 520, type = "triangle", duration = 0.08) {
            if (systemAudioMuted) return;
            try {
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (audioCtx.state === "suspended") {
                    audioCtx.resume();
                }
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(freq * 1.5, audioCtx.currentTime + duration);

                gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);

                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch (e) {}
        }

        // ─── Controls Management ─────────────────────────────────────────────
        const root = document.documentElement;
        const btnTheme = document.getElementById("btn-toggle-theme");
        const themeLabel = document.getElementById("theme-label");
        const btnSound = document.getElementById("btn-toggle-sound");
        const soundLabel = document.getElementById("sound-label");

        function updateThemeUI() {
            const isAmber = root.getAttribute("data-theme") === "amber";
            themeLabel.textContent = isAmber ? "AMBER" : "GREEN";
        }

        function toggleTheme() {
            const current = root.getAttribute("data-theme");
            if (current === "amber") {
                root.removeAttribute("data-theme");
                localStorage.removeItem("theme");
            } else {
                root.setAttribute("data-theme", "amber");
                localStorage.setItem("theme", "amber");
            }
            updateThemeUI();
            playRetroChime(640, "sine", 0.06);
        }

        function updateSoundUI() {
            soundLabel.textContent = systemAudioMuted ? "MUTED" : "ON";
            if (systemAudioMuted) {
                btnSound.classList.remove("active-opt");
            } else {
                btnSound.classList.add("active-opt");
            }
        }

        function toggleSound() {
            systemAudioMuted = !systemAudioMuted;
            localStorage.setItem("system_sound_muted", systemAudioMuted ? "true" : "false");
            updateSoundUI();
            if (!systemAudioMuted) {
                playRetroChime(780, "sine", 0.07);
            }
        }

        updateThemeUI();
        updateSoundUI();

        btnTheme.addEventListener("click", toggleTheme);
        btnSound.addEventListener("click", toggleSound);

        // ─── Smooth Matrix Rain with Fluid Avoidance & Character Flicker ─────
        const canvas = document.getElementById("matrix-canvas");
        const ctx = canvas.getContext("2d");

        let width = (canvas.width = window.innerWidth);
        let height = (canvas.height = window.innerHeight);

        window.addEventListener("resize", () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            initColumns();
        });

        // Glyph character set (Katakana + Hex + Latin + Cyber Symbols)
        const chars = "ｦｱｳｴｵｶｷｹｺｻｼｽｾｿﾀﾂﾃﾅﾆﾇﾈﾊﾋﾎﾏﾐﾑﾒﾓﾔﾕﾗﾘﾜ0123456789ABCDEF<>/*+=~$_#";
        const fontSize = 16;
        let columns = [];

        function initColumns() {
            const count = Math.floor(width / fontSize);
            columns = [];
            for (let i = 0; i < count; i++) {
                columns.push({
                    x: i * fontSize,
                    y: Math.random() * -100,
                    speed: 1.1 + Math.random() * 1.8,
                    chars: Array.from({ length: 24 }, () => chars[Math.floor(Math.random() * chars.length)]),
                    isAccent: Math.random() > 0.85
                });
            }
        }
        initColumns();

        let mouseX = -1000;
        let mouseY = -1000;
        window.addEventListener("mousemove", (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;
        });

        function renderMatrix() {
            const isAmber = root.getAttribute("data-theme") === "amber";

            // Gradual dark trail decay
            ctx.fillStyle = isAmber ? "rgba(6, 3, 1, 0.13)" : "rgba(2, 5, 2, 0.13)";
            ctx.fillRect(0, 0, width, height);

            ctx.font = `${fontSize}px "Share Tech Mono", monospace`;

            const repelRadius = 110;

            for (let i = 0; i < columns.length; i++) {
                const col = columns[i];
                const baseX = col.x;

                for (let j = 0; j < col.chars.length; j++) {
                    const charY = (col.y - j) * fontSize;
                    if (charY < -fontSize || charY > height + fontSize) continue;

                    // ─── Fluid Mouse Deflection Curve ───
                    const dx = baseX - mouseX;
                    const dy = charY - mouseY;
                    const dist = Math.hypot(dx, dy);

                    let drawX = baseX;
                    let drawY = charY;

                    if (dist < repelRadius && dist > 0) {
                        const force = Math.pow((1 - dist / repelRadius), 1.6);
                        const angle = Math.atan2(dy, dx);
                        
                        // Push smoothly sideways and slightly away
                        drawX += Math.cos(angle) * force * 45;
                        drawY += Math.sin(angle) * force * 20;
                    }

                    // Active character flicker & cipher mutations
                    if (Math.random() < 0.075) {
                        col.chars[j] = chars[Math.floor(Math.random() * chars.length)];
                    }

                    // Lead character is smoothly brighter
                    if (j === 0) {
                        if (isAmber) {
                            ctx.fillStyle = col.isAccent ? "#ffc2d4" : "#fff5c2";
                        } else {
                            ctx.fillStyle = col.isAccent ? "#ffa3f0" : "#d6ffde";
                        }
                    } else {
                        // Dynamic shimmering character alpha flicker
                        let flickerMod = 1.0;
                        const rand = Math.random();
                        if (rand > 0.94) flickerMod = 1.35;
                        else if (rand < 0.06) flickerMod = 0.5;

                        const baseAlpha = Math.max(0.08, 0.85 * (1 - j / col.chars.length));
                        const alpha = Math.min(1.0, Math.max(0.05, baseAlpha * flickerMod));

                        if (isAmber) {
                            ctx.fillStyle = col.isAccent
                                ? `rgba(255, 77, 136, ${alpha})`
                                : `rgba(255, 196, 56, ${alpha})`;
                        } else {
                            ctx.fillStyle = col.isAccent
                                ? `rgba(224, 36, 195, ${alpha})`
                                : `rgba(91, 248, 112, ${alpha})`;
                        }
                    }

                    ctx.fillText(col.chars[j], drawX, drawY);
                }

                col.y += col.speed * 0.25;

                if (col.y * fontSize > height + (col.chars.length * fontSize)) {
                    col.y = 0;
                    col.speed = 1.1 + Math.random() * 1.8;
                }
            }

            requestAnimationFrame(renderMatrix);
        }
        renderMatrix();

        // ─── Uptime Counter ──────────────────────────────────────────────────
        const start = Date.now();
        const uptimeEl = document.getElementById("uptime");
        setInterval(() => {
            const elapsed = Math.floor((Date.now() - start) / 1000);
            const hrs = String(Math.floor(elapsed / 3600)).padStart(2, "0");
            const mins = String(Math.floor((elapsed % 3600) / 60)).padStart(2, "0");
            const secs = String(elapsed % 60).padStart(2, "0");
            if (uptimeEl) uptimeEl.textContent = `UPTIME: ${hrs}:${mins}:${secs}`;
        }, 1000);

        // ─── Entry Trigger ───────────────────────────────────────────────────
        let transitioning = false;
        function enterOS() {
            if (transitioning) return;
            transitioning = true;
            playRetroChime(880, "triangle", 0.12);
            document.getElementById("main-stage").classList.add("fade-out");
            setTimeout(() => {
                window.location.href = "./home.html";
            }, 350);
        }

        document.getElementById("btn-enter").addEventListener("click", enterOS);
        window.addEventListener("keydown", (e) => {
            if (e.key === "Enter" || e.key === " ") {
                e.preventDefault();
                enterOS();
            }
        });
    </script>
</body>
</html>
