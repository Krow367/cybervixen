<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber Vixen</title>
    <link rel="icon" type="image/x-icon" href="img/icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=VT323&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="ciphers.css">
    <script src="mobilecheck.js"></script>
    <script>
        const savedTheme = localStorage.getItem("theme");
        if (savedTheme) {
            document.documentElement.setAttribute("data-theme", savedTheme);
        }
    </script>
    <style>
        /* ── Green Theme (Default) ── */
        :root {
            --bg: #020502;
            --phosphor: #5bf870;
            --phosphor-bright: #afffc0;
            --phosphor-dim: #2ca539;
            --phosphor-glow: rgba(91, 248, 112, 0.6);
            --accent: #e024c3;
            --accent-bright: #ff85eb;
            --accent-glow: rgba(224, 36, 195, 0.6);
            --cursor-auto: url("/img/curosr.png"), auto;
            --cursor-pointer: url("/img/pointer.png"), pointer;
        }

        /* ── Amber Theme ── */
        :root[data-theme="amber"] {
            --bg: #060301;
            --phosphor: #ffc438;
            --phosphor-bright: #fff3c4;
            --phosphor-dim: #b37812;
            --phosphor-glow: rgba(255, 196, 56, 0.6);
            --accent: #ff4d88;
            --accent-bright: #ffa3c2;
            --accent-glow: rgba(255, 77, 136, 0.6);
            --cursor-auto: url("/img/curosr_amber.png"), auto;
            --cursor-pointer: url("/img/pointer_amber.png"), pointer;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            height: 100%;
            background: var(--bg);
            color: var(--phosphor);
            font-family: "Share Tech Mono", monospace;
            overflow: hidden;
            user-select: none;
            cursor: var(--cursor-auto);
            transition: background 0.3s ease;
        }

        a, button, [role="button"], .interactive {
            cursor: var(--cursor-pointer) !important;
        }

        /* ── Canvas Matrix Rain ── */
        #matrix-canvas {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            opacity: 0.88;
        }

        /* ── CRT Scanlines & Vignette ── */
        .crt-overlay {
            position: fixed;
            inset: 0;
            z-index: 50;
            pointer-events: none;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.4) 50%),
                        radial-gradient(circle at center, transparent 40%, rgba(0, 0, 0, 0.9) 100%);
            background-size: 100% 4px, 100% 100%;
        }

        /* ── Minimal Header Controls ── */
        .header-controls {
            position: fixed;
            top: 14px;
            right: 14px;
            z-index: 200;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.85rem;
            background: rgba(0, 0, 0, 0.8);
            border: 1px solid var(--phosphor-dim);
            padding: 5px 10px;
            border-radius: 2px;
            backdrop-filter: blur(4px);
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.9);
        }

        .header-controls button {
            color: var(--phosphor);
            background: transparent;
            border: 1px solid transparent;
            font-family: inherit;
            font-size: 0.8rem;
            padding: 3px 7px;
            transition: all 0.15s;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .header-controls button.active-opt {
            border-color: var(--phosphor);
            background: rgba(255, 255, 255, 0.08);
            font-weight: bold;
            text-shadow: 0 0 8px var(--phosphor-glow);
        }

        .header-controls button:hover:not(.active-opt) {
            background: rgba(255, 255, 255, 0.05);
        }

        .divider {
            color: var(--phosphor-dim);
            opacity: 0.5;
        }

        /* ── Prominent Corner Telemetry HUD ── */
        .hud-corner {
            position: fixed;
            z-index: 60;
            font-size: 0.9rem;
            color: var(--phosphor-bright);
            letter-spacing: 0.18em;
            padding: 1.5rem 1.75rem;
            line-height: 1.7;
            text-shadow: 0 0 8px var(--phosphor-glow), 0 2px 4px #000;
            pointer-events: none;
        }

        .top-left { top: 0; left: 0; }
        .bottom-left { bottom: 0; left: 0; }
        .bottom-right { bottom: 0; right: 0; text-align: right; }

        .status-dot {
            display: inline-block;
            width: 9px;
            height: 9px;
            background: var(--phosphor);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--phosphor);
            margin-right: 8px;
        }

        /* ── Main Stage ── */
        .stage {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            box-sizing: border-box;
            text-align: center;
        }

        .brand-container {
            margin-bottom: 2.25rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .brand-sub {
            font-size: 1rem;
            letter-spacing: 0.45em;
            color: var(--phosphor-bright);
            text-transform: uppercase;
            margin-bottom: 0.5rem;
            text-shadow: 0 0 10px var(--phosphor-glow), 0 2px 6px #000;
            font-weight: bold;
            opacity: 0;
            animation: powerOnSurround 0.8s ease-out forwards 3.25s;
        }

        .brand-title {
            font-family: "VT323", monospace;
            font-size: clamp(5.5rem, 14vw, 11rem);
            letter-spacing: 0.2em;
            text-transform: uppercase;
            line-height: 0.88;
            margin: 0.25rem 0;
            user-select: none;
        }

        .brand-cyber {
            display: inline-block;
            color: var(--phosphor);
            opacity: 0;
            animation: neonIgniteCyber 1.1s cubic-bezier(0.1, 0.9, 0.2, 1) forwards 0.8s;
        }

        .brand-vixen {
            display: inline-block;
            color: var(--accent);
            opacity: 0;
            animation: neonIgniteVixen 1.1s cubic-bezier(0.1, 0.9, 0.2, 1) forwards 2.05s;
        }

        @keyframes neonIgniteCyber {
            0% {
                opacity: 0;
                text-shadow: none;
            }
            15% {
                opacity: 0.85;
                text-shadow: 0 0 10px var(--phosphor-glow);
            }
            22% {
                opacity: 0.1;
                text-shadow: none;
            }
            36% {
                opacity: 0.95;
                text-shadow: 0 0 16px var(--phosphor-glow), 0 0 30px var(--phosphor-glow);
            }
            48% {
                opacity: 0.25;
                text-shadow: 0 0 4px var(--phosphor-glow);
            }
            62% {
                opacity: 1;
                text-shadow: 0 0 18px var(--phosphor-glow), 0 0 45px var(--phosphor-glow), 0 4px 12px #000;
            }
            74% {
                opacity: 0.88;
            }
            84%, 100% {
                opacity: 1;
                text-shadow: 0 0 18px var(--phosphor-glow), 0 0 45px var(--phosphor-glow), 0 4px 12px #000;
            }
        }

        @keyframes neonIgniteVixen {
            0% {
                opacity: 0;
                text-shadow: none;
            }
            15% {
                opacity: 0.9;
                text-shadow: 0 0 10px var(--accent-glow);
            }
            22% {
                opacity: 0.08;
                text-shadow: none;
            }
            36% {
                opacity: 0.95;
                text-shadow: 0 0 16px var(--accent-glow), 0 0 30px var(--accent-glow);
            }
            48% {
                opacity: 0.3;
                text-shadow: 0 0 4px var(--accent-glow);
            }
            62% {
                opacity: 1;
                text-shadow: 0 0 18px var(--accent-glow), 0 0 45px var(--accent-glow), 0 4px 12px #000;
            }
            74% {
                opacity: 0.88;
            }
            84%, 100% {
                opacity: 1;
                text-shadow: 0 0 18px var(--accent-glow), 0 0 45px var(--accent-glow), 0 4px 12px #000;
            }
        }

        .brand-tagline {
            margin-top: 1rem;
            font-size: 1.25rem;
            letter-spacing: 0.3em;
            color: var(--phosphor-bright);
            text-shadow: 0 0 10px var(--phosphor-glow), 0 2px 8px #000;
            font-weight: 500;
            opacity: 0;
            animation: powerOnSurround 0.8s ease-out forwards 3.35s;
        }

        /* ── Enter Button ── */
        .enter-btn {
            background: rgba(0, 0, 0, 0.75);
            border: 2px solid var(--phosphor);
            color: var(--phosphor);
            font-family: "Share Tech Mono", monospace;
            font-size: 1.3rem;
            letter-spacing: 0.22em;
            text-transform: uppercase;
            padding: 1.1rem 2.8rem;
            transition: all 0.2s cubic-bezier(0.2, 0.8, 0.2, 1);
            box-shadow: 0 0 25px rgba(0, 0, 0, 0.9), inset 0 0 12px rgba(0, 0, 0, 0.6), 0 0 20px var(--phosphor-glow);
            backdrop-filter: blur(6px);
            position: relative;
            overflow: hidden;
            display: inline-flex;
            align-items: center;
            gap: 14px;
            opacity: 0;
            animation: powerOnSurround 0.8s ease-out forwards 3.45s;
        }

        .enter-btn:hover {
            background: var(--phosphor);
            color: #000;
            box-shadow: 0 0 40px var(--phosphor-glow);
            transform: translateY(-2px);
        }

        .enter-btn:active {
            transform: translateY(0);
        }

        .enter-hint {
            margin-top: 1.25rem;
            font-size: 0.85rem;
            color: var(--phosphor-dim);
            letter-spacing: 0.2em;
            text-shadow: 0 2px 4px #000;
            opacity: 0;
            animation: powerOnSurround 0.8s ease-out forwards 3.55s;
        }

        @keyframes powerOnSurround {
            0% {
                opacity: 0;
                transform: translateY(8px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .brand-cyber, .brand-vixen, .brand-sub, .brand-tagline, .enter-btn, .enter-hint {
                animation: none !important;
                opacity: 1 !important;
                transform: none !important;
            }
        }

        /* ── Transition Out ── */
        .fade-out {
            opacity: 0;
            transform: scale(1.08);
            filter: blur(12px);
            transition: all 0.35s ease-in;
        }

        @media (max-width: 600px) {
            .hud-corner { display: none; }
            .brand-sub { font-size: 0.8rem; }
            .brand-tagline { font-size: 0.95rem; }
            .enter-btn { font-size: 1rem; padding: 0.85rem 1.8rem; }
            .header-controls { font-size: 0.75rem; padding: 4px 8px; }
        }
    </style>
</head>
<body>
    <canvas id="matrix-canvas"></canvas>
    <div class="crt-overlay"></div>

    <nav class="header-controls">
        <button type="button" id="btn-toggle-theme" title="Toggle Green / Amber Theme">
            THEME: <span id="theme-label">GREEN</span>
        </button>
        <span class="divider">|</span>
        <button type="button" id="btn-toggle-sound" title="Toggle System Sounds">
            SOUND: <span id="sound-label">ON</span>
        </button>
    </nav>

    <div class="hud-corner top-left">
        <div><span class="status-dot"></span>SYS_STAT: ONLINE</div>
        <div>NET_LINK: FOXNET-42</div>
    </div>

    <div class="hud-corner bottom-left">
        <div id="uptime">UPTIME: 00:00:00</div>
        <div>SEC_LEVEL: 0x7F</div>
    </div>

    <div class="hud-corner bottom-right">
        <div>PROTOCOL: HTTPS/SERENITY ENCRYPTION</div>
        <div>ENGINE: foxOS v1.33.7</div>
    </div>

    <main class="stage" id="main-stage">
        <div class="brand-container">
            <div class="brand-sub">// A NEOCITIES NETWORK NODE //</div>
            <h1 class="brand-title">
                <span class="brand-cyber">CYBER</span><span class="brand-vixen">VIXEN</span>
            </h1>
            <div class="brand-tagline">"Harmony Engineered."</div>
        </div>

        <button class="enter-btn interactive" id="btn-enter" type="button">
            <span>[ INITIALIZE SYSTEM ]</span>
            <span>→</span>
        </button>
        <div class="enter-hint">PRESS [ENTER] OR [SPACE]</div>
    </main>

    <script type="module">
        import { openCipherVaultModal, updateCipherCounterUI, unlockCipher } from "./ciphers.js";

        // Initialize Cipher UI Counter
        updateCipherCounterUI();

        // ─── Sound Synthesizer (Web Audio API) ───────────────────────────────
        let audioCtx = null;
        let systemAudioMuted = localStorage.getItem("system_sound_muted") === "true";

        function getAudioContext() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === "suspended") {
                audioCtx.resume();
            }
            return audioCtx;
        }

        // Pre-warm AudioContext on very first user touch/click/key so initial sound plays with 100% full attack
        const warmUpAudio = () => {
            getAudioContext();
            window.removeEventListener("pointerdown", warmUpAudio);
            window.removeEventListener("keydown", warmUpAudio);
        };
        window.addEventListener("pointerdown", warmUpAudio, { passive: true });
        window.addEventListener("keydown", warmUpAudio, { passive: true });

        function playRetroChime(freq = 520, type = "triangle", duration = 0.08) {
            if (systemAudioMuted) return;
            try {
                const ctx = getAudioContext();
                const now = ctx.currentTime;
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, now);
                osc.frequency.exponentialRampToValueAtTime(freq * 1.5, now + duration);

                gain.gain.setValueAtTime(0.25, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + duration);

                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start(now);
                osc.stop(now + duration);
            } catch (e) {}
        }

        // Windows 98 "Chord / Error" strike with crunchy corrupted digital glitch
        function playFoxBoop() {
            if (systemAudioMuted) return;
            try {
                const ctx = getAudioContext();
                const now = ctx.currentTime;

                // Win98 Chord Harmonics (Eb3, Bb3, Eb4, G4, Eb5 brassy digital chime)
                const freqs = [155.56, 233.08, 311.13, 392.00, 622.25];

                // Filter with classic 90s Sound Blaster / FM resonant warmth
                const filter = ctx.createBiquadFilter();
                filter.type = "lowpass";
                filter.frequency.setValueAtTime(4500, now);
                filter.frequency.exponentialRampToValueAtTime(750, now + 0.38);
                filter.Q.setValueAtTime(3.5, now);

                // Corrupted Distortion / Bitcrush Waveshaper curve
                const waveShaper = ctx.createWaveShaper();
                const samples = 1024;
                const curve = new Float32Array(samples);
                for (let i = 0; i < samples; i++) {
                    const x = (i * 2) / samples - 1;
                    const steps = 16;
                    const crushed = Math.round(x * steps) / steps;
                    curve[i] = Math.tanh(crushed * 1.8);
                }
                waveShaper.curve = curve;

                // Boosted Master Volume with Dynamics Compressor (Loud, crunchy & impactful)
                const masterGain = ctx.createGain();
                masterGain.gain.setValueAtTime(1.4, now);
                masterGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.46);

                // Glitchy digital transient burst
                const noiseBuf = ctx.createBuffer(1, Math.floor(ctx.sampleRate * 0.04), ctx.sampleRate);
                const noiseData = noiseBuf.getChannelData(0);
                for (let i = 0; i < noiseData.length; i++) {
                    noiseData[i] = (Math.random() * 2 - 1) * (1 - i / noiseData.length);
                }
                const noiseSrc = ctx.createBufferSource();
                noiseSrc.buffer = noiseBuf;
                const noiseGain = ctx.createGain();
                noiseGain.gain.setValueAtTime(0.7, now);
                noiseGain.gain.exponentialRampToValueAtTime(0.001, now + 0.04);
                noiseSrc.connect(noiseGain);
                noiseGain.connect(filter);
                noiseSrc.start(now);

                // Spawn the layered Win98 chord oscillators with boosted amplitudes
                freqs.forEach((freq, idx) => {
                    const osc = ctx.createOscillator();
                    osc.type = idx % 2 === 0 ? "sawtooth" : "triangle";
                    osc.frequency.setValueAtTime(freq * 1.08, now);
                    osc.frequency.exponentialRampToValueAtTime(freq, now + 0.035);

                    const oscGain = ctx.createGain();
                    oscGain.gain.setValueAtTime(0.95 / freqs.length, now);

                    osc.connect(oscGain);
                    oscGain.connect(filter);
                    osc.start(now);
                    osc.stop(now + 0.46);
                });

                filter.connect(waveShaper);
                waveShaper.connect(masterGain);
                masterGain.connect(ctx.destination);
            } catch (e) {}
        }

        // ─── Controls Management ─────────────────────────────────────────────
        const root = document.documentElement;
        const btnTheme = document.getElementById("btn-toggle-theme");
        const themeLabel = document.getElementById("theme-label");
        const btnSound = document.getElementById("btn-toggle-sound");
        const soundLabel = document.getElementById("sound-label");
        const btnCiphers = document.getElementById("btn-open-ciphers");

        function updateThemeUI() {
            const isAmber = root.getAttribute("data-theme") === "amber";
            themeLabel.textContent = isAmber ? "AMBER" : "GREEN";
        }

        function toggleTheme() {
            const current = root.getAttribute("data-theme");
            if (current === "amber") {
                root.removeAttribute("data-theme");
                localStorage.removeItem("theme");
            } else {
                root.setAttribute("data-theme", "amber");
                localStorage.setItem("theme", "amber");
            }
            updateThemeUI();
            playRetroChime(640, "sine", 0.06);
        }

        function updateSoundUI() {
            soundLabel.textContent = systemAudioMuted ? "MUTED" : "ON";
            if (systemAudioMuted) {
                btnSound.classList.remove("active-opt");
            } else {
                btnSound.classList.add("active-opt");
            }
        }

        function toggleSound() {
            systemAudioMuted = !systemAudioMuted;
            localStorage.setItem("system_sound_muted", systemAudioMuted ? "true" : "false");
            updateSoundUI();
            if (!systemAudioMuted) {
                playRetroChime(780, "sine", 0.07);
            }
        }

        updateThemeUI();
        updateSoundUI();

        btnTheme.addEventListener("click", toggleTheme);
        btnSound.addEventListener("click", toggleSound);
        btnCiphers?.addEventListener("click", () => {
            playRetroChime(580, "sine", 0.05);
            openCipherVaultModal();
        });

        // ─── Canvas & Viewport Setup ─────────────────────────────────────────
        const canvas = document.getElementById("matrix-canvas");
        const ctx = canvas.getContext("2d");

        let width = (canvas.width = window.innerWidth);
        let height = (canvas.height = window.innerHeight);

        window.addEventListener("resize", () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            initColumns();
            createWorldCodeCanvas();
        });

        // ─── SPEED & IDLE CONFIGURATION SETTINGS ─────────────────────────────
        const FOX_SPEED = 6.8; // Speed of the phantom fox (pixels per frame)
        const IDLE_TRIGGER_DELAY_MS = 10000; // in milliseconds. 2000 = 2 seconds

        // ─── Full-Screen World-Space Code Revealer Setup ─────────────────────
        let loadedCodeLines = [];

        const worldCodeCanvas = document.createElement("canvas");
        const worldCodeCtx = worldCodeCanvas.getContext("2d");

        function createWorldCodeCanvas() {
            worldCodeCanvas.width = width;
            worldCodeCanvas.height = height;
            const isAmber = root.getAttribute("data-theme") === "amber";

            worldCodeCtx.fillStyle = isAmber ? "#0c0401" : "#010803";
            worldCodeCtx.fillRect(0, 0, width, height);

            const rowHeight = 21;
            const fontSize = 12;
            worldCodeCtx.font = `bold ${fontSize}px "Share Tech Mono", monospace`;

            const topMargin = 20;
            const bottomMargin = 20;
            const availableHeight = height - topMargin - bottomMargin;
            const rowsPerColumn = Math.max(5, Math.floor(availableHeight / rowHeight));

            const columnWidth = 490;
            const numColumns = Math.ceil(width / columnWidth) + 1;

            let lineIndex = 0;

            for (let c = 0; c < numColumns; c++) {
                const colX = 18 + c * columnWidth;

                worldCodeCtx.save();
                worldCodeCtx.beginPath();
                worldCodeCtx.rect(colX, 0, columnWidth - 25, height);
                worldCodeCtx.clip();

                for (let r = 0; r < rowsPerColumn; r++) {
                    const rowY = topMargin + r * rowHeight;
                    const line = (loadedCodeLines.length > 0) ? loadedCodeLines[lineIndex % loadedCodeLines.length] : "// FOXNET ONLINE";
                    lineIndex++;

                    const trimmed = line.trim();
                    if (trimmed.startsWith("//") || trimmed.startsWith("/*") || trimmed.startsWith("<!") || trimmed.startsWith("*")) {
                        worldCodeCtx.fillStyle = isAmber ? "rgba(255, 196, 56, 0.6)" : "rgba(91, 248, 112, 0.6)";
                    } else if (line.includes("function") || line.includes("import") || line.includes("export") || line.includes("const") || line.includes("return")) {
                        worldCodeCtx.fillStyle = isAmber ? "#ff3366" : "#ff40d0";
                    } else if (line.includes("0x") || line.includes("crypto") || line.includes("unlockCipher") || line.includes("AudioContext")) {
                        worldCodeCtx.fillStyle = isAmber ? "#ffffff" : "#ffffff";
                    } else if (r % 2 === 0) {
                        worldCodeCtx.fillStyle = isAmber ? "#fff0a8" : "#85ffa0";
                    } else {
                        worldCodeCtx.fillStyle = isAmber ? "#ffb338" : "#48e86c";
                    }

                    worldCodeCtx.fillText(line, colX, rowY);
                }

                worldCodeCtx.restore();
            }
        }

        async function loadSourceCodeFile() {
            try {
                const res = await fetch("data/revealed_code.txt?v=" + Date.now());
                if (res.ok) {
                    const text = await res.text();
                    const parsed = text.split("\n").map(l => l.trimEnd()).filter(l => l.length > 0);
                    if (parsed.length > 0) {
                        loadedCodeLines = parsed;
                    }
                }
            } catch (err) {}
            createWorldCodeCanvas();
        }
        loadSourceCodeFile();

        // ─── Load Silhouette & Feathered Glow Sheets ─────────────────────────
        const blackSheet = new Image();
        let blackLoaded = false;
        blackSheet.onload = () => { blackLoaded = true; };
        blackSheet.src = "img/fox_solid_black_sheet.png";

        const glowGreenSheet = new Image();
        let glowGreenLoaded = false;
        glowGreenSheet.onload = () => { glowGreenLoaded = true; };
        glowGreenSheet.src = "img/fox_glow_green_sheet.png";

        const glowAmberSheet = new Image();
        let glowAmberLoaded = false;
        glowAmberSheet.onload = () => { glowAmberLoaded = true; };
        glowAmberSheet.src = "img/fox_glow_amber_sheet.png";

        const TOTAL_CYCLE_FRAMES = 20;
        const FRAME_SRC_W = 340;
        const FRAME_SRC_H = 200;
        const FOX_SCALE = 1.35;
        const RENDER_W = Math.round(FRAME_SRC_W * FOX_SCALE);
        const RENDER_H = Math.round(FRAME_SRC_H * FOX_SCALE);

        const foxBufferCanvas = document.createElement("canvas");
        const foxBufferCtx = foxBufferCanvas.getContext("2d");
        foxBufferCanvas.width = RENDER_W;
        foxBufferCanvas.height = RENDER_H;

        // ─── 7-Lane Non-Repeating Shuffle Bag ────────────────────────────────
        const HEIGHT_LANES = [0.18, 0.28, 0.38, 0.48, 0.58, 0.68, 0.78];
        let laneShuffleBag = [];

        function getNextShuffledLane() {
            if (laneShuffleBag.length === 0) {
                laneShuffleBag = [...HEIGHT_LANES];
                for (let i = laneShuffleBag.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [laneShuffleBag[i], laneShuffleBag[j]] = [laneShuffleBag[j], laneShuffleBag[i]];
                }
            }
            return laneShuffleBag.pop();
        }

        // ─── Phantom Fox State ───────────────────────────────────────────────
        let ghostFox = {
            active: false,
            x: -RENDER_W - 50,
            y: height * 0.5,
            speed: FOX_SPEED,
            frame: 0,
            frameTimer: 0
        };

        function triggerPhantomFoxRun() {
            ghostFox.active = true;
            ghostFox.x = -RENDER_W - 30;
            ghostFox.y = height * getNextShuffledLane();
            ghostFox.speed = FOX_SPEED;
            ghostFox.frame = 0;
            ghostFox.frameTimer = 0;
        }

        // ─── 20-Second Ambient Easter Egg Interval ──────────────────────────
        // Mouse movement does NOT reset the timer, so users enjoying the fluid
        // matrix rain deflection still get treated to the phantom fox sprint!
        let idleTimer = null;

        function startFoxTimer() {
            if (idleTimer) clearTimeout(idleTimer);
            idleTimer = setTimeout(() => {
                triggerPhantomFoxRun();
            }, IDLE_TRIGGER_DELAY_MS);
        }

        // Arm the 20-second timer on page load
        startFoxTimer();

        // ─── Click Hitbox on Phantom Fox (Cipher Unlock Ready) ───────────────
        window.addEventListener("click", (e) => {
            // Ignore clicks on UI buttons, nav controls, or modals
            if (e.target.closest("#btn-enter, .header-controls, .cipher-modal-overlay")) return;
            if (!ghostFox.active) return;

            const clickX = e.clientX;
            const clickY = e.clientY;
            const drawX = Math.round(ghostFox.x);
            const drawY = Math.round(ghostFox.y - RENDER_H * 0.5);

            // Check if click occurred within the fox's bounding area
            if (
                clickX >= drawX && clickX <= drawX + RENDER_W &&
                clickY >= drawY && clickY <= drawY + RENDER_H
            ) {
                // ─── CIPHER UNLOCK HOOK ───
                // When you are ready with a cipher name, uncomment and fill in:
                // unlockCipher("CIPHER_NAME_HERE");
                console.log("[CIPHER_EVENT] Phantom Fox caught!");
                playFoxBoop();
            }
        });

        // Glyph character set (Katakana + Hex + Latin + Cyber Symbols)
        const chars = "ｦｱｳｴｵｶｷｹｺｻｼｽｾｿﾀﾂﾃﾅﾆﾇﾈﾊﾋﾎﾏﾐﾑﾒﾓﾔﾕﾗﾘﾜ0123456789ABCDEF<>/*+=~$_#";
        const fontSize = 16;
        let columns = [];

        function initColumns() {
            const count = Math.floor(width / fontSize);
            columns = [];
            for (let i = 0; i < count; i++) {
                columns.push({
                    x: i * fontSize,
                    y: Math.random() * -100,
                    speed: 1.1 + Math.random() * 0.3,
                    chars: Array.from({ length: 24 }, () => chars[Math.floor(Math.random() * chars.length)]),
                    isAccent: Math.random() > 0.85
                });
            }
        }
        initColumns();

        let mouseX = -1000;
        let mouseY = -1000;
        window.addEventListener("mousemove", (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;
        });

        function renderMatrix() {
            const isAmber = root.getAttribute("data-theme") === "amber";

            // Gradual dark trail decay
            ctx.fillStyle = isAmber ? "rgba(6, 3, 1, 0.13)" : "rgba(2, 5, 2, 0.13)";
            ctx.fillRect(0, 0, width, height);

            // ─── LAYER 1: Draw Phantom Fox Stencil (Behind Matrix Rain) ──────
            const isReady = blackLoaded || (blackSheet.complete && blackSheet.naturalWidth > 0);
            if (ghostFox.active && isReady) {
                ghostFox.x += ghostFox.speed;

                ghostFox.frameTimer++;
                if (ghostFox.frameTimer >= 2) {
                    ghostFox.frameTimer = 0;
                    ghostFox.frame = (ghostFox.frame + 1) % TOTAL_CYCLE_FRAMES;
                }

                const drawX = Math.round(ghostFox.x);
                const drawY = Math.round(ghostFox.y - RENDER_H * 0.5);

                const activeGlowSheet = isAmber ? glowAmberSheet : glowGreenSheet;
                const glowReady = isAmber ? (glowAmberLoaded || glowAmberSheet.complete) : (glowGreenLoaded || glowGreenSheet.complete);

                ctx.save();

                // A. Draw Phosphor Glow Aura (0.08 Feathered Aura)
                if (glowReady && activeGlowSheet.naturalWidth > 0) {
                    ctx.globalAlpha = 0.08;
                    ctx.drawImage(
                        activeGlowSheet,
                        ghostFox.frame * FRAME_SRC_W, 0, FRAME_SRC_W, FRAME_SRC_H,
                        drawX, drawY, RENDER_W, RENDER_H
                    );
                }

                // B. World-Space Code Stencil
                foxBufferCtx.clearRect(0, 0, RENDER_W, RENDER_H);
                foxBufferCtx.globalCompositeOperation = "source-over";
                foxBufferCtx.drawImage(
                    blackSheet,
                    ghostFox.frame * FRAME_SRC_W, 0, FRAME_SRC_W, FRAME_SRC_H,
                    0, 0, RENDER_W, RENDER_H
                );

                foxBufferCtx.globalCompositeOperation = "source-in";
                foxBufferCtx.drawImage(worldCodeCanvas, -drawX, -drawY);

                // C. Blit Stenciled Fox to Main Canvas
                ctx.globalAlpha = 1.0;
                ctx.drawImage(foxBufferCanvas, drawX, drawY);
                ctx.restore();

                // Loop / Schedule next sprint
                if (ghostFox.x > width + RENDER_W + 50) {
                    ghostFox.active = false;
                    startFoxTimer();
                }
            }

            // ─── LAYER 2: Draw Falling Matrix Rain (On Top of Fox) ───────────
            ctx.font = `${fontSize}px "Share Tech Mono", monospace`;

            const repelRadius = 110;

            for (let i = 0; i < columns.length; i++) {
                const col = columns[i];
                const baseX = col.x;

                for (let j = 0; j < col.chars.length; j++) {
                    const charY = (col.y - j) * fontSize;
                    if (charY < -fontSize || charY > height + fontSize) continue;

                    // ─── Fluid Mouse Deflection Curve ───
                    const dx = baseX - mouseX;
                    const dy = charY - mouseY;
                    const dist = Math.hypot(dx, dy);

                    let drawX = baseX;
                    let drawY = charY;

                    if (dist < repelRadius && dist > 0) {
                        const force = Math.pow((1 - dist / repelRadius), 1.6);
                        const angle = Math.atan2(dy, dx);
                        
                        // Push smoothly sideways and slightly away
                        drawX += Math.cos(angle) * force * 45;
                        drawY += Math.sin(angle) * force * 20;
                    }

                    // Active character flicker & cipher mutations
                    if (Math.random() < 0.075) {
                        col.chars[j] = chars[Math.floor(Math.random() * chars.length)];
                    }

                    // Lead character is smoothly brighter
                    if (j === 0) {
                        if (isAmber) {
                            ctx.fillStyle = col.isAccent ? "#ffc2d4" : "#fff5c2";
                        } else {
                            ctx.fillStyle = col.isAccent ? "#ffa3f0" : "#d6ffde";
                        }
                    } else {
                        // Dynamic shimmering character alpha flicker
                        let flickerMod = 1.0;
                        const rand = Math.random();
                        if (rand > 0.94) flickerMod = 1.35;
                        else if (rand < 0.06) flickerMod = 0.5;

                        const baseAlpha = Math.max(0.08, 0.85 * (1 - j / col.chars.length));
                        const alpha = Math.min(1.0, Math.max(0.05, baseAlpha * flickerMod));

                        if (isAmber) {
                            ctx.fillStyle = col.isAccent
                                ? `rgba(255, 77, 136, ${alpha})`
                                : `rgba(255, 196, 56, ${alpha})`;
                        } else {
                            ctx.fillStyle = col.isAccent
                                ? `rgba(224, 36, 195, ${alpha})`
                                : `rgba(91, 248, 112, ${alpha})`;
                        }
                    }

                    ctx.fillText(col.chars[j], drawX, drawY);
                }

                col.y += col.speed * 0.25;

                if (col.y * fontSize > height + (col.chars.length * fontSize)) {
                    col.y = 0;
                    col.speed = 1.1 + Math.random() * 1.8;
                }
            }

            requestAnimationFrame(renderMatrix);
        }
        renderMatrix();

        // ─── Uptime Counter ──────────────────────────────────────────────────
        const start = Date.now();
        const uptimeEl = document.getElementById("uptime");
        setInterval(() => {
            const elapsed = Math.floor((Date.now() - start) / 1000);
            const hrs = String(Math.floor(elapsed / 3600)).padStart(2, "0");
            const mins = String(Math.floor((elapsed % 3600) / 60)).padStart(2, "0");
            const secs = String(elapsed % 60).padStart(2, "0");
            if (uptimeEl) uptimeEl.textContent = `UPTIME: ${hrs}:${mins}:${secs}`;
        }, 1000);

        // ─── Entry Trigger ───────────────────────────────────────────────────
        let transitioning = false;
        function enterOS() {
            if (transitioning) return;
            transitioning = true;
            document.getElementById("main-stage").classList.add("fade-out");
            setTimeout(() => {
                window.location.href = "./home.html";
            }, 350);
        }

        document.getElementById("btn-enter").addEventListener("click", enterOS);
        window.addEventListener("keydown", (e) => {
            if (e.key === "Enter" || e.key === " ") {
                e.preventDefault();
                enterOS();
            }
        });
    </script>
</body>
