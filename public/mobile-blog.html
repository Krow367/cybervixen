<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog — CyberVixen</title>
    <link rel="icon" type="image/x-icon" href="img/icon.png">
    <style>
        :root {
            --bg: #0a0a0a;
            --border: #2a2a2a;
            --drawer-width: 260px;
            --phosphor: #5bf870;
            --phosphor-dim: #39ff1488;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: var(--bg);
            color: var(--phosphor);
            font-family: "Courier New", Courier, monospace;
            min-height: 100vh;
            overflow-x: hidden;
        }

        header {
            padding: 0.75rem 1rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 0.75rem;
            position: sticky;
            top: 0;
            background: var(--bg);
            z-index: 10;
        }

        header a.back {
            color: var(--phosphor);
            text-decoration: none;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        header h1 {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            flex: 1;
        }

        /* ── Drawer toggle button ── */
        #drawer-toggle {
            background: transparent;
            border: 1px solid var(--phosphor);
            color: var(--phosphor);
            font-family: "Courier New", Courier, monospace;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            padding: 0.3rem 0.6rem;
            cursor: pointer;
        }

        /* ── Drawer overlay (backdrop) ── */
        #drawer-backdrop {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            z-index: 20;
        }

        #drawer-backdrop.open { display: block; }

        /* ── Slide-out drawer ── */
        #drawer {
            position: fixed;
            top: 0;
            right: 0;
            width: var(--drawer-width);
            height: 100%;
            background: #0d0d0d;
            border-left: 1px solid var(--phosphor);
            z-index: 30;
            transform: translateX(100%);
            transition: transform 0.25s ease-out;
            display: flex;
            flex-direction: column;
            padding: 1rem;
            box-sizing: border-box;
            box-shadow: -4px 0 20px rgba(0, 0, 0, 0.8);
        }

        #drawer.open { transform: translateX(0); }

        #drawer-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            padding-bottom: 0.75rem;
            margin-bottom: 0.75rem;
        }

        #drawer-header span {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: var(--phosphor);
        }

        #drawer-close {
            background: transparent;
            border: none;
            color: var(--phosphor);
            font-family: "Courier New", Courier, monospace;
            font-size: 1rem;
            cursor: pointer;
            padding: 0 0.25rem;
        }

        #blog-nav {
            overflow-y: auto;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }

        #blog-nav a {
            color: var(--phosphor);
            text-decoration: none;
            font-size: 0.75rem;
            padding: 0.45rem 0.5rem;
            border: 1px solid transparent;
            display: block;
            line-height: 1.4;
        }

        #blog-nav a:hover,
        #blog-nav a.active {
            border-color: var(--phosphor);
            background: rgba(91, 248, 112, 0.08);
        }

        #blog-nav .nav-date {
            display: block;
            font-size: 0.65rem;
            color: var(--phosphor-dim);
            margin-bottom: 0.15rem;
        }

        /* ── Main content area ── */
        main {
            padding: 1.25rem 1rem 3rem;
            max-width: 680px;
            margin: 0 auto;
        }

        #blog-content h1 {
            font-size: 1.25rem;
            margin-top: 0.25rem;
            margin-bottom: 1.25rem;
            line-height: 1.35;
            color: var(--phosphor);
            text-shadow: 0 0 8px rgba(91, 248, 112, 0.3);
        }

        #blog-content h2 {
            font-size: 1.1rem;
            margin: 1.5rem 0 0.75rem;
            border-bottom: 1px solid var(--border);
            padding-bottom: 0.3rem;
        }

        #blog-content h3 {
            font-size: 0.75rem;
            color: var(--phosphor-dim);
            letter-spacing: 0.15em;
            text-transform: uppercase;
            margin-bottom: 0.25rem;
        }

        #blog-content p {
            font-size: 0.85rem;
            line-height: 1.7;
            margin-bottom: 1rem;
            color: #d0ffd5;
        }

        #blog-content blockquote {
            border-left: 2px solid var(--phosphor);
            padding-left: 0.75rem;
            margin: 1rem 0;
            color: #a0efa8;
            font-style: italic;
        }

        #blog-content img {
            max-width: 100%;
            height: auto;
            display: block;
            margin: 1rem auto;
            border: 1px solid var(--border);
        }

        #blog-content pre,
        #blog-content code {
            font-family: inherit;
            background: #111;
            color: var(--phosphor);
            border: 1px solid var(--border);
            padding: 0.2rem 0.4rem;
            font-size: 0.8rem;
        }

        #blog-content pre {
            padding: 0.75rem;
            overflow-x: auto;
            margin: 1rem 0;
        }

        .loading-state {
            text-align: center;
            padding: 3rem 0;
            color: var(--phosphor-dim);
            font-size: 0.85rem;
            letter-spacing: 0.1em;
        }
    </style>
</head>
<body>
    <div id="drawer-backdrop"></div>
    <div id="drawer">
        <div id="drawer-header">
            <span>// POST ARCHIVE //</span>
            <button id="drawer-close" aria-label="Close">✕</button>
        </div>
        <div id="blog-nav"><!-- auto-populated --></div>
    </div>

    <header>
        <a href="mobile-menu.html" class="back">← Menu</a>
        <a href="mobile-chat.html" class="back">Chat</a>
        <h1>log.exe</h1>
        <button id="drawer-toggle">≡ Archive</button>
    </header>

    <main>
        <div id="blog-content">
            <div class="loading-state">// FETCHING POSTS FROM MEMORY //</div>
        </div>
    </main>

    <script type="module">
        const nav      = document.getElementById("blog-nav");
        const content  = document.getElementById("blog-content");
        const drawer   = document.getElementById("drawer");
        const backdrop = document.getElementById("drawer-backdrop");
        const toggle   = document.getElementById("drawer-toggle");
        const closeBtn = document.getElementById("drawer-close");

        function openDrawer()  { drawer.classList.add("open"); backdrop.classList.add("open"); }
        function closeDrawer() { drawer.classList.remove("open"); backdrop.classList.remove("open"); }

        toggle.addEventListener("click", openDrawer);
        closeBtn.addEventListener("click", closeDrawer);
        backdrop.addEventListener("click", closeDrawer);

        try {
            const files = await fetch("/blog/index.json").then(r => r.json());

            const postsData = await Promise.all(
                files.map(async (name) => {
                    const text = await fetch(`/blog/${name}`).then(r => r.text());
                    const parser = new DOMParser();
                    const doc = parser.parseFromString(text, "text/html");
                    const date = doc.querySelector("h3")?.textContent || name.replace(".html", "");
                    const title = doc.querySelector("h1")?.textContent || name.replace(".html", "").replaceAll("-", " ");
                    return { name, date, title, html: text };
                })
            );

            // Populate nav list
            postsData.forEach((post, index) => {
                const a = document.createElement("a");
                a.href = "#";
                a.innerHTML = `<span class="nav-date">${post.date}</span><span class="nav-title">${post.title}</span>`;
                if (index === 0) a.classList.add("active");
                nav.appendChild(a);

                a.addEventListener("click", (e) => {
                    e.preventDefault();
                    nav.querySelectorAll("a").forEach(l => l.classList.remove("active"));
                    a.classList.add("active");
                    content.innerHTML = post.html;
                    window.scrollTo(0, 0);
                    closeDrawer();
                });
            });

            // Display newest post by default
            if (postsData.length > 0) {
                content.innerHTML = postsData[0].html;
            } else {
                content.innerHTML = "<p>No posts found.</p>";
            }
        } catch (err) {
            console.error("Failed to load blog posts:", err);
            content.innerHTML = "<p>// ERROR: Failed to load blog logs //</p>";
        }
    </script>
</body>
</html>
